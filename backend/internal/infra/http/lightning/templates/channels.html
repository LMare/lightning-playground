{{$node := .NodeID}}{{range $i, $c := .Channels}}
	<tr data-channel-point="{{.ChannelPoint}}" data-status="{{.Status}}">
		<th scope="row" id="table-channels-body-row-{{$i}}" title="{{.RemotePubKey}}">{{truncate .RemotePubKey 8}}</th>
		<td headers="table-channels-body-row-{{$i}} channel-capacity">{{.CapacitySat}}</td>
		<td headers="table-channels-body-row-{{$i}} channel-local">{{.LocalBalanceSat}}</td>
		<td headers="table-channels-body-row-{{$i}} channel-remote">{{.RemoteBalanceSat}}</td>
		<td headers="table-channels-body-row-{{$i}} channel-status">{{.StatusLabel}}</td>
		<td headers="table-channels-body-row-{{$i}} channel-actions">{{if .Closable}}
			<form hx-post="/lightning/channel/close" hx-swap="none" hx-confirm="Close this channel cooperatively?" data-confirm-label="Close channel" style="display:inline">
				<input type="hidden" name="id" value="{{$node}}">
				<input type="hidden" name="channelPoint" value="{{.ChannelPoint}}">
				<input type="hidden" name="force" value="false">
				<button type="submit" class="border border-gray-300 p-1 rounded text-sm" title="Close the channel">Close</button>
			</form>
			<form hx-post="/lightning/channel/close" hx-swap="none" hx-confirm="Force close this channel? Your funds stay locked for the CSV delay." data-confirm-label="Force close" style="display:inline">
				<input type="hidden" name="id" value="{{$node}}">
				<input type="hidden" name="channelPoint" value="{{.ChannelPoint}}">
				<input type="hidden" name="force" value="true">
				<button type="submit" class="border border-gray-300 p-1 rounded text-sm" title="Force close the channel">Force close</button>
			</form>
		{{end}}</td>
	</tr>
{{else}}
	<tr><td colspan="6">No channel</td></tr>
{{end}}
