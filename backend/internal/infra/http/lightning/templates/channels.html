{{$node := .NodeID}}{{range .Channels}}
	<tr data-channel-point="{{.ChannelPoint}}" data-status="{{.Status}}">
		<td title="{{.RemotePubKey}}">{{truncate .RemotePubKey 8}}</td>
		<td>{{.CapacitySat}}</td>
		<td>{{.LocalBalanceSat}}</td>
		<td>{{.RemoteBalanceSat}}</td>
		<td>{{.StatusLabel}}</td>
		<td>{{if .Closable}}
			<form hx-post="__API_PREFIX__/lightning/channel/close" hx-swap="none" hx-confirm="Close this channel cooperatively?" style="display:inline">
				<input type="hidden" name="id" value="{{$node}}">
				<input type="hidden" name="channelPoint" value="{{.ChannelPoint}}">
				<input type="hidden" name="force" value="false">
				<button type="submit" class="text-sm" title="Close the channel">Close</button>
			</form>
			<form hx-post="__API_PREFIX__/lightning/channel/close" hx-swap="none" hx-confirm="Force close this channel? Your funds stay locked for the CSV delay." style="display:inline">
				<input type="hidden" name="id" value="{{$node}}">
				<input type="hidden" name="channelPoint" value="{{.ChannelPoint}}">
				<input type="hidden" name="force" value="true">
				<button type="submit" class="text-sm" title="Force close the channel">Force close</button>
			</form>
		{{end}}</td>
	</tr>
{{else}}
	<tr><td colspan="6">No channel</td></tr>
{{end}}
