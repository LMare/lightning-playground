{{range $i, $p := .}}
	<tr class="">
		<th scope="row" id="table-persons-body-row-{{$i}}">{{$p.Index}}</th>
		<td headers="table-persons-body-row-{{$i}} nom">{{$p.Person.Nom}}</td>
		<td headers="table-persons-body-row-{{$i}} prenom">{{$p.Person.Prenom}}</td>
		<td headers="table-persons-body-row-{{$i}} age">{{$p.Person.Age}}</td>
	</tr>
{{end}}
