# Loadbalancer intern to access to a pod api
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lightning-playground
  labels:
      app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
  - name: api
    port: 8080
    targetPort: api-port
  - name: ops
    port: 9090
    targetPort: ops-port
