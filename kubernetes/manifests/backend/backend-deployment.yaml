# Deployement of pod backend in stateless
apiVersion: apps/v1
kind: Deployment  # -> des pods stateless, on scale facilement
metadata:
  annotations:
    author: LMare
  labels:
    app: backend
  name: backend
  namespace : lightning-playground
spec:
  replicas: 1 # SSE needs a broker (NATS, separate branch) before scaling: single hard-coded session
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      enableServiceLinks: false # conflit with .env variable
      serviceAccountName: backend-service-account
      volumes:
        - name: lnd-shared-data
          emptyDir: {}
      containers:
        - name: backend
          image: LMare/lightning-playground-backend:v0.3.1
          ports:
            - name: backend-port
              containerPort: 8080
            - name: ops-port # /health, /ready, /metrics: cluster-internal, not behind the ingress
              containerPort: 9090
          volumeMounts:
            - name: lnd-shared-data
              mountPath: /app/node-storage
          livenessProbe:
            httpGet:
              path: /health
              port: ops-port
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: ops-port
            initialDelaySeconds: 5
            periodSeconds: 10

        - name: sidecar
          image: LMare/lightning-playground-sidecar-backend:v0.3.1
          volumeMounts:
            - name: lnd-shared-data
              mountPath: /app/nodes-storage

        - name: debug
          image: busybox
          command: ["sleep", "infinity"]
          stdin: true
          tty: true
          volumeMounts:
            - name: lnd-shared-data
              mountPath: /app/node-storage


      restartPolicy: Always
